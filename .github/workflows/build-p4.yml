# Firmware build for the esp32p4 target in the official ESP-IDF container.
#
# Image tag: espressif/idf:v5.5.5 — the exact release the project builds with (README.md,
# "Building") and the one dependencies.lock records as `idf: 5.5.5`. Checked on Docker Hub
# 2026-09-21: the tag exists (pushed 2026-07-17), so no "closest tag" substitution.
#
# dependencies.lock is committed. The build must resolve exactly the locked
# component set; if the Component Manager rewrote the lock (a manifest changed without
# the lock being updated) the "lock file honoured" step fails.
name: build-p4

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-p4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # components/etl/etl

      - name: Let git work on a checkout owned by another uid (container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Python deps for tools/generate_ui.py (runs at CMake configure time)
        run: |
          . "$IDF_PATH/export.sh"
          python -m pip install -r tools/requirements.txt

      - name: Build for esp32p4
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32p4
          idf.py build

      - name: Lock file honoured (the resolved set is the committed one)
        run: git diff --exit-code -- dependencies.lock

      - name: Size report
        run: |
          . "$IDF_PATH/export.sh"
          mkdir -p size-report
          idf.py size | tee size-report/size.txt
          {
            echo
            echo "== images =="
            ls -l build/*.bin build/bootloader/*.bin build/partition_table/*.bin
          } | tee -a size-report/size.txt
          cp build/project_description.json size-report/
          cp dependencies.lock size-report/

      - uses: actions/upload-artifact@v4
        with:
          name: size-report-esp32p4
          path: size-report/
          if-no-files-found: error
